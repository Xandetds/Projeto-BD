<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Usuários</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 p-8 min-h-screen">
    <div class="max-w-4xl mx-auto bg-gray-800 p-8 rounded-lg shadow-xl">
        <h1 class="text-3xl font-bold mb-6 text-indigo-400">Gerenciamento de Usuários</h1>

        <div class="mb-6">
            <a href="{{ url_for('add_user') }}" class="inline-block bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-md transition duration-300 shadow-md">
                Adicionar Novo Usuário
            </a>
        </div>

        {% if users %}
        <div class="overflow-x-auto">
            <table class="min-w-full bg-gray-700 rounded-lg shadow-md overflow-hidden">
                <thead class="bg-gray-600 text-gray-300 uppercase text-sm leading-normal">
                    <tr>
                        <th class="py-3 px-6 text-left">ID</th>
                        <th class="py-3 px-6 text-left">Nome</th>
                        <th class="py-3 px-6 text-left">Email</th>
                        <th class="py-3 px-6 text-left">Data Nasc.</th>
                        <th class="py-3 px-6 text-center">Ações</th> 
                    </tr>
                </thead>
                <tbody class="text-gray-200 text-sm font-light">
                    {% for user in users %}
                    <tr class="border-b border-gray-600 hover:bg-gray-600">
                        <td class="py-3 px-6 text-left whitespace-nowrap">{{ user[0] }}</td>
                        <td class="py-3 px-6 text-left">{{ user[1] }}</td>
                        <td class="py-3 px-6 text-left">{{ user[2] }}</td>
                        <td class="py-3 px-6 text-left">{{ user[3] }}</td>
                        <td class="py-3 px-6 text-center">
                            <div class="flex item-center justify-center space-x-2">
                                <a href="{{ url_for('edit_user', user_id=user[0]) }}" class="bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-1 px-3 rounded-md transition duration-300 text-xs">
                                    Editar
                                </a>
                                <form action="{{ url_for('delete_user', user_id=user[0]) }}" method="post" onsubmit="return confirm('Tem certeza que deseja deletar este usuário?');">
                                    <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold py-1 px-3 rounded-md transition duration-300 text-xs">
                                        Deletar
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
        {% else %}
        <p class="text-gray-400 text-lg text-center mt-8">Nenhum usuário cadastrado ainda.</p>
        {% endif %}
    </div>
</body>
</html>
