<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuário</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 p-8 min-h-screen flex items-center justify-center">
    <div class="max-w-lg w-full bg-gray-800 p-8 rounded-lg shadow-xl">
        <h1 class="text-3xl font-bold mb-6 text-indigo-400 text-center">Editar Usuário</h1>

        {% if error %}
            <p class="bg-red-500 text-white p-3 rounded-md mb-4 text-center">{{ error }}</p>
        {% endif %}

        {% if user %}
        <form method="post" action="{{ url_for('edit_user', user_id=user[0]) }}" class="space-y-4">
            <div>
                <label for="nome" class="block text-gray-300 text-sm font-bold mb-1">Nome:</label>
                <input type="text" id="nome" name="nome" value="{{ user[1] }}" required class="shadow-sm appearance-none border border-gray-700 rounded-md w-full py-2 px-3 bg-gray-700 text-gray-100 leading-tight focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition duration-200">
            </div>
            <div>
                <label for="email" class="block text-gray-300 text-sm font-bold mb-1">Email:</label>
                <input type="email" id="email" name="email" value="{{ user[2] }}" required class="shadow-sm appearance-none border border-gray-700 rounded-md w-full py-2 px-3 bg-gray-700 text-gray-100 leading-tight focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition duration-200">
            </div>
            <div>
                <label for="senha" class="block text-gray-300 text-sm font-bold mb-1">Senha (deixe em branco para não alterar):</label>
                <input type="password" id="senha" name="senha" class="shadow-sm appearance-none border border-gray-700 rounded-md w-full py-2 px-3 bg-gray-700 text-gray-100 leading-tight focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition duration-200">
            </div>
            <div>
                <label for="data_nascimento" class="block text-gray-300 text-sm font-bold mb-1">Data de Nascimento:</label>
                <input type="date" id="data_nascimento" name="data_nascimento" value="{{ user[4] | default('', true) if user[4] else '' }}" required class="shadow-sm appearance-none border border-gray-700 rounded-md w-full py-2 px-3 bg-gray-700 text-gray-100 leading-tight focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition duration-200">
            </div>
            <div class="flex justify-between items-center mt-6">
                <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-md focus:outline-none focus:shadow-outline transition duration-300 shadow-md">
                    Atualizar Usuário
                </button>
                <a href="{{ url_for('index') }}" class="inline-block bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded-md focus:outline-none focus:shadow-outline transition duration-300 shadow-md">
                    Cancelar
                </a>
            </div>
        </form>
        {% else %}
        <p class="text-gray-400 text-lg text-center mt-8">Usuário não encontrado para edição.</p>
        {% endif %}
    </div>
</body>
</html>
